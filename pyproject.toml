[project]
name = "agenticlangraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "durgaprasad4521", email = "durgaprasad@kascommerce.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-google-vertexai>=3.2.5",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
]

[project.scripts]
agenticlangraph = "agenticlangraph:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
